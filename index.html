  #loader.done { opacity: 0; pointer-events: none; }

  .core { position: absolute; left: 50%; top: 50%; width: min(45vw, 220px); aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 14%; background: #1a95ff; }
  .core svg { position: absolute; inset: 7%; width: 86%; height: 86%; }
  .ticks line { stroke: rgba(255,255,255,.3); stroke-width: 1.5; }
  .disc { fill: #2fa1ff; stroke: #4cb0ff; stroke-width: 2; }
  .ring { fill: none; stroke: #e6f2ff; stroke-width: 12; stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 100px 100px; }
  .label { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; }
  .label b { font-size: clamp(16px, 5.2vw, 24px); letter-spacing: .5px; }
  .label span { font-size: clamp(14px, 4.4vw, 20px); font-weight: 600; margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) { #loader { transition: none; } }

  /* ===== нижнее меню / игры ===== */

  /* ===== Фон-узор (подарки) из вашего файла ===== */
  :root { --pattern-color: #ffffff; --pattern-opacity: .2; }
  html { background: var(--bg); }
  body { background: transparent; position: relative; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-color: var(--pattern-color);
    -webkit-mask-image: url(#giftBgMask); mask-image: url(#giftBgMask);
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    opacity: var(--pattern-opacity); }


  :root { --h: 62px; --bg: #141414; --glass: rgba(40,39,39,.85); --text: #fff; --primary: #1689ff; --purple: #1689ff;
    --glass-shadow: inset 0 0 0 1px rgba(255,255,255,.03), inset 1.8px 3px 0 -2px rgba(255,255,255,.27), inset -2px -2px 0 -2px rgba(255,255,255,.24), inset -3px -8px 1px -6px rgba(255,255,255,.18), 0 1px 5px rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.16); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }

  .tabbar { z-index: 50; position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 512px;
    padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .row { display: flex; align-items: center; gap: 8px; }

  .games { box-shadow: var(--glass-shadow); flex: 0 0 auto; width: 70px; height: var(--h); border: 0; border-radius: 99em; background: var(--glass);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
  .games span { font-weight: 700; font-size: 10px; letter-spacing: -.4px; color: rgba(255,255,255,.4); }
  .games svg { width: 20px; height: 20px; color: rgba(255,255,255,.4); }

  .switcher { box-shadow: var(--glass-shadow); position: relative; flex: 1; min-width: 0; height: var(--h); padding: 4px; display: grid;
    grid-template-columns: 1fr 1fr; border-radius: 99em; background: var(--glass); }
  .switcher::after { content: ""; position: absolute; left: 4px; top: 4px; height: calc(var(--h) - 8px);
    width: calc(50% - 4px); border-radius: 99em; background: rgba(0,0,0,.3);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: translate .44s cubic-bezier(.5,0,0,1); translate: calc(var(--i, 0) * 100%); }
  .switcher[data-active="-1"]::after { display: none; }
  .switcher.go::after { animation: stretch .44s ease; }
  .switcher[data-dir="r"]::after { transform-origin: right center; }
  .switcher[data-dir="l"]::after { transform-origin: left center; }
  @keyframes stretch { 0% { scale: 1; } 50% { scale: 1.12 1.1; } 100% { scale: 1; } }
  .opt { position: relative; z-index: 1; border: 0; background: transparent; color: #fff; opacity: .4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 2px; cursor: pointer; transition: opacity .16s; }
  .games, .profile, .opt { transition: transform .18s cubic-bezier(.3,0,0,1), opacity .16s, color .16s, background .16s; will-change: transform; }
  .games:active, .profile:active { transform: scale(.9); }
  .opt:active { transform: scale(.88); }
  .opt svg, .games svg { transition: scale .2s cubic-bezier(.5,0,0,1), rotate .5s cubic-bezier(.3,0,0,1); }
  .opt:hover { opacity: .7; }
  .opt.active:hover { opacity: 1; }
  .opt:hover svg { scale: 1.1; }
  .opt.active:hover svg { scale: 1; }
  .games.spin svg { rotate: 360deg; }
  .ava { transition: border-color .25s, transform .25s; }
  .profile.active .ava { transform: scale(1.04); }
  .opt.active { color: var(--primary); opacity: 1; }
  .opt svg { width: 26px; height: 26px; }

  .opt:hover .tasks-ico { scale: 1.1; }
  .opt.active:hover .tasks-ico { scale: 1; }
  .opt span { font-weight: 500; font-size: 10px; line-height: 1.2; white-space: nowrap; }

  .profile { box-shadow: var(--glass-shadow); flex: 0 0 auto; width: var(--h); height: var(--h); border-radius: 99em; background: var(--glass);
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .profile .ava { width: 42px; height: 42px; border-radius: 50%; background: #3a3a3a; border: 2px solid #2a2a2a;
    overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .profile .ava { transition: border-color .2s, box-shadow .2s; }
  .profile.active .ava { border-color: var(--primary); }
  .games.active { color: var(--purple); }
  .games.active svg, .games.active span { color: var(--purple); }
  .profile img { width: 100%; height: 100%; object-fit: cover; }

  /* ===== Раздел «Игры» (по портал-версии) ===== */
  #gamesPage { --gs: inset 0 0 0 1px rgba(255,255,255,.03), inset 1.8px 3px 0 -2px rgba(255,255,255,.27), inset -2px -2px 0 -2px rgba(255,255,255,.24), inset -3px -8px 1px -6px rgba(255,255,255,.18), inset -.3px -1px 4px 0 rgba(0,0,0,.24), inset -1.5px 2.5px 0 -2px rgba(0,0,0,.4), inset 0 3px 4px -2px rgba(0,0,0,.4), inset 2px -6.5px 1px -4px rgba(0,0,0,.2), 0 1px 5px 0 rgba(0,0,0,.2), 0 6px 16px 0 rgba(0,0,0,.16);
    --accent: #c5e5ff; display: none; position: fixed; inset: 0; z-index: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 72px) 0 calc(env(safe-area-inset-bottom, 0px) + 130px); }
  #gamesPage.active { display: block; }
  .gq-wrap { max-width: 448px; margin: 0 auto; padding: 0 16px; }
  .gq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .gq { position: relative; display: block; isolation: isolate; width: 100%; min-width: 0; aspect-ratio: 1 / 1; margin: 0; padding: 0; border: 0;
    border-radius: 32px; background: none; color: #fff; font: inherit; text-align: left; cursor: pointer;
    transition: transform .55s cubic-bezier(.34,1.56,.64,1); will-change: transform; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .gq.wide { grid-column: 1 / -1; aspect-ratio: 2.15 / 1; }
  .gq::after { content: ""; position: absolute; inset: 0; z-index: 5; border-radius: inherit; pointer-events: none; opacity: 0;
    background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.32);
    transition: opacity .35s ease-out; }
  .gq.pressed { transform: scale(.94); transition: transform .22s cubic-bezier(.2,.7,.2,1); }
  .gq.pressed::after { opacity: 1; transition-duration: .15s; }

  .gq-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 12px 12px 20px; border-radius: 32px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.24), var(--gs); }
  .gq.wide .gq-in { align-items: flex-start; padding: 20px; box-shadow: var(--gs); }
  .gq-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .gq-front { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: space-between; width: 100%; height: 100%; }
  .gq.wide .gq-front { align-items: flex-start; }

  .gq:not(.wide) .gq-front { justify-content: flex-end; }
  .gq-top { display: flex; align-items: center; gap: 4px; max-width: 100%; }
  .gq-pill { display: flex; flex: none; align-items: center; gap: 4px; height: 21px; padding: 0 10px; border-radius: 8px;
    background: rgba(19,38,59,.65); box-shadow: var(--gs); color: #fff; font-size: 10px; line-height: 12px; font-weight: 700; letter-spacing: -.3px; }
  .gq-pill svg { width: 11px; height: 11px; }
  .gq-dot { display: flex; align-items: center; justify-content: center; width: 9px; height: 9px; border-radius: 50%; background: rgba(197,229,255,.2); }
  .gq-dot i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .gq-on b { font-size: 10px; line-height: 9px; font-weight: 700; letter-spacing: -.6px; color: var(--accent); }

  .gq-name { font-size: 28px; line-height: 24px; font-weight: 700; letter-spacing: -.6px; color: #fff; }
  .gq.wide .gq-name { font-size: 32px; line-height: 32px; letter-spacing: -.7px; }

  .gq-art { position: absolute; left: 50%; top: 45%; width: 56%; aspect-ratio: 1; transform: translate(-50%, -50%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }

  img.gq-art { top: 42%; width: 62%; object-fit: contain; }

  /* Arena: синий фон + жёлтый и красный сектора + три игрока */
  .gq-arena { background: #1686fd; }
  .gq-sec { position: absolute; inset: 0; }
  .gq-sec.y { background: #f2ae00; clip-path: polygon(46% 0%, 100% 0%, 55% 50%); }
  .gq-sec.r { background: #ce1612; clip-path: polygon(100% 0%, 100% 100%, 62% 100%, 55% 50%); }
  .gq-pl { position: absolute; top: 0; left: 0; width: 20%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.2); }
  .gq-pl.a { background: #ff7100; transform: translate(251.25%, -1.74%) scale(.8); }
  .gq-pl.b { background: #06467f; transform: translate(185%, 122.09%) scale(.9); }
  .gq-pl.c { background: #ff5b5f; transform: translate(361.25%, 94.77%) scale(1.457); }
</style>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) {
      const ava = document.getElementById('ava');
      const initials = () => {
        const t = ((u.first_name || '')[0] || '') + ((u.last_name || '')[0] || '') || (u.username || '?')[0];
        ava.textContent = t.toUpperCase();
      };
      if (u.photo_url) {
        const img = new Image();
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        img.onload = () => ava.replaceChildren(img);   // аватарка из Telegram (Web тоже)
        img.onerror = initials;                        // нет фото / скрыто в приватности
        img.src = u.photo_url;
      } else initials();                               // фото не передано — буквы имени
    }
    
  }

  const sw = document.getElementById('sw');
  const opts = [...sw.querySelectorAll('.opt')];
  function go(name) {
    const i = opts.findIndex(o => o.dataset.go === name);
    document.querySelector('.profile').classList.toggle('active', name === 'profile');
    document.querySelector('.games').classList.toggle('active', name === 'games');
    opts.forEach((o, k) => o.classList.toggle('active', k === i));
    const prev = +sw.dataset.active;
    sw.dataset.dir = i > prev ? 'l' : 'r';
    sw.classList.remove('go'); void sw.offsetWidth;
    if (i >= 0) sw.classList.add('go');
    sw.dataset.active = i;
    const g = document.querySelector('.games');
    if (name === 'games') {
      g.style.transition = 'none'; g.classList.remove('spin'); void g.offsetWidth; g.style.transition = '';
      requestAnimationFrame(() => g.classList.add('spin'));
    } else g.classList.remove('spin');
    sw.style.setProperty('--i', Math.max(i, 0));
    document.getElementById('gamesPage').classList.toggle('active', name === 'games');
    // сюда подключай остальные экраны: показать раздел name
    console.log('open:', name);
  }
  // Онлайн в карточках игр: setOnline('crash', 12) — обновит счётчик
  window.setOnline = (game, n) => {
    const c = document.querySelector('.gq[data-game="' + game + '"] .gq-count');
    if (c) c.textContent = n;
  };
  document.querySelectorAll('.gq').forEach(el => el.addEventListener('click', () => {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    document.dispatchEvent(new CustomEvent('open-game', { detail: el.dataset.game })); // crash | arena | upgrade
  }));
  document.querySelectorAll('.gq').forEach(el => {
    let t0 = 0, timer = 0;
    const on = () => { clearTimeout(timer); t0 = Date.now(); el.classList.add('pressed'); };
    const off = () => { clearTimeout(timer); timer = setTimeout(() => el.classList.remove('pressed'), Math.max(0, 130 - (Date.now() - t0))); };
    el.addEventListener('pointerdown', on);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, off));
  });
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => go(el.dataset.go)));
</script>
<script>

  const ring = document.getElementById('ring');
  const pct = document.getElementById('pct');
  const C = 2 * Math.PI * 78;
  ring.style.strokeDasharray = C;

  function setProgress(p) {
    ring.style.strokeDashoffset = C * (1 - p / 100);
    pct.textContent = Math.round(p) + '%';
  }
  setProgress(0);

  let CAP = 50;            // пока статус неизвестен — 50%; допущен → 75%; техработы → стоим на 50%
  let progress = 0;
  const tick = setInterval(() => {
    progress += (CAP - progress) * 0.05;
    setProgress(progress);
  }, 100);

  async function initApp() {
    // сюда твоя реальная загрузка: профиль, подарки, магазин, лидерборд
    await new Promise(r => setTimeout(r, 3000));
  }

  // Пока идёт загрузка — плавно доходим до 75%.
  // Когда приложение готово — плавно доезжаем до 100% (без резкого скачка) и скрываем лоадер.
  function finishLoader() {
    clearInterval(tick);
    document.getElementById('app').style.display = '';
    const from = progress, dur = 900, t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / dur);
      progress = from + (100 - from) * k;
      setProgress(progress);
      if (k < 1) return requestAnimationFrame(step);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      setTimeout(() => document.getElementById('loader').classList.add('done'), 400);
    })(t0);
  }
  window.finishLoader = finishLoader;

  // ===== ТЕХРАБОТЫ =====
  // Включаются и выключаются в боте: /admin → «Техработы». Допущенных людей тоже добавляешь там.
  // Мини-апп спрашивает у сервера бота; сервер сам проверяет подпись Telegram и отвечает:
  //   { "maintenance": true|false, "allowed": true|false }
  const STATUS_URL = 'https://advertisers-brand-individually-beliefs.trycloudflare.com.';   // TODO: адрес, где запущен бот
  async function getStatus() {
    try {
      const r = await fetch(STATUS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: (tg && tg.initData) || '' }),
        cache: 'no-store'
      });
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) { return { maintenance: false, allowed: true }; }   // сервер недоступен — не блокируем
  }
  function canEnter(st) {
    return !st.maintenance || st.allowed === true;
  }
  function holdMaintenance() {
    CAP = 50;
    document.querySelector('.label b').textContent = 'ТЕХРАБОТЫ';
    // проверяем раз в 10 сек: вдруг работы закончились или тебя добавили в список
    const poll = setInterval(async () => {
      const st = await getStatus();
      if (canEnter(st)) { clearInterval(poll); document.querySelector('.label b').textContent = 'ЗАГРУЗКА'; finishLoader(); }
    }, 10000);
  }

  async function boot() {
    const minShow = new Promise(r => setTimeout(r, 1500));
    const [st] = await Promise.all([getStatus(), initApp(), minShow]);
    if (!canEnter(st)) return holdMaintenance();
    CAP = 75;
    finishLoader();
  }
  boot();
</script>
</body>
